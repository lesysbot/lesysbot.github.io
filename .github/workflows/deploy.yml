name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deploy at a time, and let a newer push supersede a queued one —
# but never cancel a deploy that is already mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # The install one-liner in every README points at these URLs. Nothing else
      # in the build would notice if content/static/ stopped being published —
      # the site would look perfectly fine and `curl … | sh` would 404 for
      # everyone.
      - name: Root files really shipped
        run: |
          test -s dist/install.sh
          test -s dist/install.ps1
          test -s dist/catalog.json
          head -1 dist/install.sh | grep -qx '#!/bin/sh'

      - name: Check for broken internal links
        run: node scripts/check-links.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
